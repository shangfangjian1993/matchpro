database:
  # PostgreSQL+Redis 改造:env DATABASE_URL 优先;此处为配置单一源。
  # 生产(推荐):
  #   default_url: postgresql+psycopg2://matchpro:CHANGE_ME@postgres:5432/football
  # 本地开发(sqlite 回退):
  default_url: sqlite:///data/football.db
redis:
  # 缓存后端:local(单进程内存)| redis(跨进程共享,生产)
  cache_backend: local
  url: redis://localhost:6379/0
  prediction_ttl: 600
api:
  host: 0.0.0.0
  port: 8000
  workers: 2
  rate_limit_per_minute: 200
scheduler:
  daily:
  - 08:00
  - '22:00'
  fixtures: 09:30
  injury: '14:00'
  weekly_retrain: Mon 03:00
data_sources:
  football_data_org:
    base: https://api.football-data.org/v4
  football_data_co_uk:
    base: https://www.football-data.co.uk/mmz4281
  understat:
    base: https://understat.com/getLeagueData
  api_football:
    base: https://v3.football.api-sports.io
