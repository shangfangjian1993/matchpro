prediction:
  prior_blend:
    # 审查七 V7-1:近期环境先验混合(2026 高平局赛季修复)。
    # P_final = α·P_model + (1-α)·近期实际频率(截止该场最近 window 场)
    # 离线验证(W=100, α=0.6):2026 ll 1.1254→1.0952, ECE 0.127→0.044;
    # 2025 不退化(ll 0.9949→0.9916, ECE 0.042)。2026-08 上线。
    enabled: true
    window: 100
    alpha: 0.6
    min_history: 50
ensemble:
  default_weights:
    hgbr: 1.0
    dc: 0.0
    nb: 0.0
    elo: 0.0
  learning:
    window: 500
    min_samples: 150
dixon_coles:
  tau_default: 0.0
  tau_range:
  - -0.2
  - 0.2
negbin:
  phi_default: 1000000000.0
elo_goal:
  base: 1.6
  spread: 1.0
training:
  cv_folds: 5
  holdout_fraction: 0.2
  sample_weight:
    enabled: false
    method: time_decay
    half_life_days: 365
    min_weight: 0.05
    normalize: true
leagues:
  premier_league:
    model_type: HGBR
    version: 1.0.0
    parameters:
      loss: poisson
      learning_rate: 0.03
      max_depth: 6
      min_samples_leaf: 10
      max_iter: 300
      early_stopping_rounds: 25
      validation_fraction: 0.15
      random_state: 42
