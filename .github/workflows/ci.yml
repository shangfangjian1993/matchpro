name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install production deps
        run: pip install -r requirements.txt

      - name: Install dev deps (ruff/pytest)
        run: pip install ruff pytest

      # 审查 21cd12b P1-5:lint 从 --select F 升级为全规则(默认规则集)
      - name: Lint (ruff full default rule set)
        run: ruff check app pipelines tests

      # 审查 21cd12b P1-5:格式一致性检查
      - name: Format check
        run: ruff format --check app pipelines tests

      - name: Compile check
        run: python -m compileall -q app pipelines tests

      - name: Unit tests (skip DB-dependent; football.db is gitignored)
        run: pytest -m "not db" -q

      # 审查 21cd12b 十六:DB 测试语义 —— 有库则必须真跑(失败=CI 红),
      # 无库则明确标记 skip,不再 continue-on-error
      - name: DB-dependent tests (require football.db)
        if: hashFiles('data/football.db') != ''
        run: pytest -m db -q

      - name: DB tests skipped (no database)
        if: hashFiles('data/football.db') == ''
        run: echo "football.db absent — DB tests skipped in CI"
